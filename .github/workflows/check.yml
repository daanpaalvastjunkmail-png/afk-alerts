name: Check release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and audio check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 ffmpeg
      - name: Test and build public plugin
        run: python3 -B tools/check_release.py --audio-assets --audio-tools
      - name: Build clean source archive
        run: python3 -B tools/build_source.py
